services:
  - type: web
    name: tindatrack
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python setup.py
    startCommand: gunicorn tindatrack.wsgi:application --workers 4 --worker-class sync --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: tindatrack.settings
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tindatrack-db
          property: connectionString

databases:
  - name: tindatrack-db
    databaseName: tindatrack
    plan: free
