{% extends 'base.html' %}

{% block login_content %}
<div class="min-h-screen flex items-center justify-center bg-bg-main p-4">
    <div class="bg-bg-card rounded-xl shadow-2xl p-8 w-full max-w-md border border-bg-hover">
        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-text-primary">TindaTrack</h1>
            <p class="text-text-secondary mt-2">Sari-Sari Store System</p>
        </div>

        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <div class="p-3 rounded-lg bg-danger-bg text-danger text-sm border border-danger">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-text-secondary mb-2">Username</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-3 bg-bg-main border border-bg-hover rounded-lg focus:ring-2 focus:ring-primary-light focus:border-primary-light text-text-primary placeholder-text-disabled"
                    placeholder="Enter username">
            </div>
            <div>
                <label class="block text-sm font-medium text-text-secondary mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-3 bg-bg-main border border-bg-hover rounded-lg focus:ring-2 focus:ring-primary-light focus:border-primary-light text-text-primary placeholder-text-disabled"
                    placeholder="Enter password">
            </div>
            <button type="submit"
                class="w-full bg-primary-light text-white py-3 rounded-lg font-medium hover:bg-primary-dark transition">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-text-secondary">
            <p>TindaTrack v1.0 - Inventory & POS System</p>
            <p class="text-xs mt-1 italic">Engineered by: WSS @2026</p>
        </div>
    </div>
</div>
{% endblock %}
